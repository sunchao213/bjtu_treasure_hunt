<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#111923"/>
      <stop offset=".62" stop-color="#1a2228"/>
      <stop offset="1" stop-color="#30302b"/>
    </linearGradient>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#252a29"/>
      <stop offset="1" stop-color="#090d12"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop stop-color="#edbc68" stop-opacity=".42"/>
      <stop offset=".36" stop-color="#d9a45b" stop-opacity=".17"/>
      <stop offset="1" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="0" y2="1">
      <stop stop-color="#e9b762" stop-opacity=".23"/>
      <stop offset="1" stop-color="#e9b762" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dialogue" x2="0" y2="1">
      <stop stop-color="#121820" stop-opacity=".91"/>
      <stop offset="1" stop-color="#0c1118" stop-opacity=".98"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="1" fill="#e6d8bd" opacity=".12"/><circle cx="77" cy="42" r=".8" fill="#e6d8bd" opacity=".1"/>
      <circle cx="39" cy="101" r=".7" fill="#e6d8bd" opacity=".1"/><circle cx="108" cy="89" r="1" fill="#e6d8bd" opacity=".08"/>
    </pattern>
  </defs>

  <!-- 夜色与远处校园 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1480" cy="238" r="165" fill="#a5a18e" opacity=".055"/>
  <path d="M0 330 Q300 300 520 335 T1020 320 T1510 336 T1920 315 V680 H0Z" fill="#10171d" opacity=".62"/>
  <g fill="#151c21" stroke="#283035" stroke-width="2" opacity=".9">
    <path d="M90 264h455v288H90z M118 225h404v39H118z"/>
    <path d="M590 310h360v247H590z M615 277h310v33H615z"/>
    <path d="M1000 282h440v279h-440z M1030 244h380v38h-380z"/>
    <path d="M1470 318h330v246h-330z M1495 285h285v33h-285z"/>
  </g>
  <g fill="#7b8178" opacity=".12">
    <path d="M130 301h48v64h-48z M205 301h48v64h-48z M280 301h48v64h-48z M355 301h48v64h-48z M430 301h48v64h-48z"/>
    <path d="M635 339h42v55h-42z M705 339h42v55h-42z M775 339h42v55h-42z M845 339h42v55h-42z"/>
    <path d="M1050 313h48v65h-48z M1130 313h48v65h-48z M1210 313h48v65h-48z M1290 313h48v65h-48z"/>
  </g>
  <!-- 樹影 -->
  <g fill="#0b1115" opacity=".92">
    <path d="M0 510Q30 330 120 370Q151 275 224 354Q294 323 322 510Z"/>
    <path d="M1610 510Q1635 352 1715 385Q1760 283 1830 365Q1900 316 1950 508Z"/>
  </g>
  <g stroke="#171d1d" stroke-width="16" opacity=".9"><path d="M185 415l-24 176M1770 425l22 182"/></g>

  <!-- 地面 -->
  <path d="M0 540 Q450 510 960 558 Q1450 520 1920 544 V1080 H0Z" fill="url(#ground)"/>
  <path d="M0 627 Q420 595 870 628 T1920 620" fill="none" stroke="#a58c64" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 790 Q500 744 950 780 T1920 760" fill="none" stroke="#9a8a6b" stroke-opacity=".09" stroke-width="2"/>
  <g fill="#a8a08b" opacity=".09"><path d="M150 654l340-11-180 8z"/><path d="M1130 708l490-22-272 15z"/><path d="M408 891l330-17-195 12z"/></g>

  <!-- 路灯光晕与灯杆 -->
  <ellipse cx="1390" cy="558" rx="405" ry="450" fill="url(#lampGlow)"/>
  <path d="M1377 219 L1132 733 Q1390 816 1658 718 L1401 219Z" fill="url(#beam)"/>
  <g stroke="#11171a" stroke-width="13" fill="none"><path d="M1410 235V590Q1410 615 1435 615h30"/></g>
  <rect x="1397" y="219" width="64" height="29" rx="5" fill="#dfb66f" opacity=".82"/>
  <rect x="1405" y="224" width="48" height="16" rx="3" fill="#f1d79c"/>
  <ellipse cx="1430" cy="249" rx="44" ry="17" fill="#e9bd73" opacity=".4" filter="url(#soft)"/>

  <!-- 旧书架轮廓 -->
  <g transform="translate(1540 440)" opacity=".77">
    <rect x="0" y="0" width="177" height="142" fill="#11171a" stroke="#625744" stroke-width="5"/>
    <path d="M0 43h177M0 87h177M0 132h177" stroke="#706047" stroke-width="5"/>
    <path d="M16 8v32m24-35v38m30-37v37m32-36v38m30-36v37m25-34v34M20 50v34m35-39v42m35-39v39m34-40v39m30-35v36M14 94v35m30-40v41m32-37v36m35-39v39m32-35v36m21-37v36" stroke="#82704e" stroke-width="8" opacity=".5"/>
  </g>

  <!-- 草稿纸与调查焦点 -->
  <g transform="translate(852 627) rotate(-8)">
    <path d="M0 18L206 0l28 137-208 25z" fill="#090d10" opacity=".42" transform="translate(10 13)"/>
    <path d="M0 0L207 -15l28 137-207 25z" fill="#c9bea2"/>
    <path d="M13 14L196 1l21 106-183 13z" fill="#dbcfb0" opacity=".52"/>
    <g stroke="#4e5c5d" stroke-width="2" opacity=".62" fill="none">
      <path d="M28 34q24-20 43 1t39-5q18-8 36 7"/><path d="M35 59l38-9 11 18 32-31 25 17 27-7"/>
      <path d="M30 87q33-17 60 2t48-7"/><path d="M42 111l33-8 18 11 33-21"/>
    </g>
    <path d="M29 119q48-15 100-5" stroke="#9b6246" stroke-width="3" opacity=".72"/>
  </g>
  <circle cx="963" cy="704" r="43" fill="none" stroke="#d8ad60" stroke-width="2" opacity=".8"/>
  <circle cx="963" cy="704" r="56" fill="none" stroke="#d8ad60" stroke-width="1" opacity=".35"/>
  <rect x="870" y="774" width="186" height="46" rx="3" fill="#111820" fill-opacity=".92" stroke="#b18d50" stroke-opacity=".7"/>
  <text x="963" y="804" text-anchor="middle" fill="#e0c786" font-size="19" font-family="'Microsoft YaHei',sans-serif" letter-spacing="2">E　调查草稿纸</text>

  <text x="1858" y="77" text-anchor="end" fill="#aeb3b0" font-size="17" font-family="'Microsoft YaHei',sans-serif">跳过序章</text>
  <path d="M1870 64h18m-6-6 6 6-6 6" fill="none" stroke="#aeb3b0" stroke-width="1.5"/>

  <!-- 电影感暗角 -->
  <rect width="1920" height="1080" fill="url(#grain)" opacity=".28"/>
  <rect width="1920" height="1080" fill="none" stroke="#05080c" stroke-width="110" opacity=".33"/>

</svg>
