<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="veil" x2="0" y2="1"><stop stop-color="#080c12" stop-opacity=".43"/><stop offset="1" stop-color="#080c12" stop-opacity=".66"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#171d25"/><stop offset="1" stop-color="#10151c"/></linearGradient>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#e2d7bd"/><stop offset="1" stop-color="#b9a987"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <image href="prologue-discovery.svg" width="1920" height="1080"/>
  <rect width="1920" height="1080" fill="url(#veil)"/>

  <!-- 调查结果面板 -->
  <rect x="476" y="214" width="968" height="650" rx="5" fill="#000" opacity=".42" filter="url(#shadow)"/>
  <rect x="480" y="205" width="960" height="650" rx="4" fill="url(#panel)" stroke="#77808a" stroke-opacity=".72" stroke-width="1.5"/>
  <rect x="480" y="205" width="960" height="3" fill="#c69c59"/>
  <text x="528" y="259" fill="#c9a86c" font-size="15" font-family="Arial,sans-serif" letter-spacing="3">CLUE  /  01</text>
  <text x="528" y="310" fill="#e7e1d2" font-size="30" font-family="'Microsoft YaHei',sans-serif">草稿纸上的字迹</text>
  <text x="1390" y="262" text-anchor="end" fill="#858e97" font-size="16" font-family="'Microsoft YaHei',sans-serif">调查记录</text>
  <path d="M528 337h864" stroke="#515a63" stroke-opacity=".65"/>

  <!-- 放大的潮湿纸张 -->
  <g transform="translate(552 380) rotate(-2)">
    <rect x="8" y="10" width="360" height="354" fill="#070a0d" opacity=".42"/>
    <path d="M0 0h360v352H0z" fill="url(#paper)"/>
    <path d="M14 14h332v324H14z" fill="none" stroke="#877b61" stroke-opacity=".55"/>
    <path d="M34 37h292" stroke="#817660" stroke-opacity=".36"/>
    <text x="40" y="82" fill="#343d40" font-size="24" font-family="'Courier New',monospace">x² + y² = ?</text>
    <text x="40" y="128" fill="#343d40" font-size="20" font-family="'Courier New',monospace">18 : 42 :: 21 : ?</text>
    <path d="M38 155q55-19 98 3t107-8" fill="none" stroke="#475353" stroke-width="2" opacity=".72"/>
    <path d="M38 181h274M38 202h212" stroke="#6c716a" stroke-opacity=".38" stroke-width="1.5"/>
    <path d="M34 232h292" stroke="#9a644c" stroke-opacity=".72" stroke-width="2"/>
    <text x="40" y="270" fill="#714b3c" font-size="20" font-family="'Microsoft YaHei',sans-serif">别走地图上没有的路。</text>
    <text x="40" y="320" fill="#727366" font-size="14" font-family="'Microsoft YaHei',sans-serif" letter-spacing="2">墨迹被水晕开，末尾有一道划痕</text>
    <path d="M284 0q-22 66 0 118t-8 113" fill="none" stroke="#fff" stroke-opacity=".23" stroke-width="18"/>
    <path d="M0 311q92-30 183 8t177-13" fill="none" stroke="#8b816a" stroke-opacity=".2" stroke-width="15"/>
  </g>

  <!-- 线索解读 -->
  <text x="970" y="402" fill="#8b949d" font-size="15" font-family="Arial,sans-serif" letter-spacing="2">OBSERVATION</text>
  <text x="970" y="450" fill="#ddd8cb" font-size="20" font-family="'Microsoft YaHei',sans-serif">几行公式无法辨认，像是在指向某个时间。</text>
  <text x="970" y="486" fill="#a8aaa2" font-size="18" font-family="'Microsoft YaHei',sans-serif">纸张最下方，有人用力写下了一句话：</text>
  <rect x="956" y="524" width="432" height="94" rx="2" fill="#24231f" stroke="#8e7045" stroke-opacity=".72"/>
  <rect x="956" y="524" width="3" height="94" fill="#bd9453"/>
  <text x="990" y="581" fill="#e0c78e" font-size="26" font-family="'Noto Serif CJK SC','Songti SC','SimSun',serif">“别走地图上没有的路。”</text>
  <text x="970" y="675" fill="#87919b" font-size="16" font-family="'Microsoft YaHei',sans-serif">这不像是给你的留言……但它似乎知道你会来。</text>

  <!-- 操作区 -->
  <path d="M528 741h864" stroke="#515a63" stroke-opacity=".65"/>
  <text x="528" y="795" fill="#79838d" font-size="15" font-family="'Microsoft YaHei',sans-serif">线索已加入手记　·　你可以稍后在准备界面查看</text>
  <g transform="translate(1100 762)">
    <rect width="136" height="52" rx="2" fill="none" stroke="#737d86" stroke-width="1.5"/>
    <text x="68" y="33" text-anchor="middle" fill="#c3c6c2" font-size="17" font-family="'Microsoft YaHei',sans-serif">稍后查看</text>
  </g>
  <g transform="translate(1252 762)">
    <rect width="140" height="52" rx="2" fill="#b38b4c"/>
    <text x="66" y="33" text-anchor="middle" fill="#10151b" font-size="17" font-family="'Microsoft YaHei',sans-serif" font-weight="600">收起线索</text>
    <path d="M109 26h15m-6-6 6 6-6 6" fill="none" stroke="#10151b" stroke-width="1.7"/>
  </g>
  <text x="1390" y="835" text-anchor="end" fill="#69747e" font-size="13" font-family="Arial,sans-serif" letter-spacing="1">ESC 返回场景</text>
</svg>
